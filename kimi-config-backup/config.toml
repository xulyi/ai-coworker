default_model = "kimi-code/kimi-for-coding"
default_thinking = true
default_yolo = false
default_plan_mode = false
default_editor = ""
theme = "dark"
show_thinking_stream = true
hooks = [
  { event = "UserPromptSubmit", command = "bash ~/.kimi/hooks/check-complex-code.sh", matcher = "", timeout = 10 },
  { event = "UserPromptSubmit", command = "bash ~/.kimi/hooks/plan-trigger.sh", matcher = "", timeout = 10 },
  { event = "PreToolUse", command = "bash ~/.kimi/hooks/karpathy-check.sh", matcher = "WriteFile|StrReplaceFile", timeout = 10 },
  { event = "PreToolUse", command = "bash ~/.kimi/hooks/plan-guard.sh", matcher = "WriteFile|StrReplaceFile", timeout = 10 },
  { event = "PostToolUse", command = "bash ~/.kimi/hooks/log-skill-call.sh", matcher = "Skill", timeout = 10 },
  { event = "PostToolUse", command = "bash ~/.kimi/hooks/track-artifacts.sh", matcher = "WriteFile|StrReplaceFile", timeout = 10 },
  { event = "Stop", command = "bash ~/.kimi/hooks/plan-stop-verify.sh", matcher = "", timeout = 10 },
  { event = "PostCompact", command = "bash ~/.kimi/hooks/context-usage.sh", matcher = "", timeout = 10 },
]
merge_all_available_skills = false

[models."kimi-code/kimi-for-coding"]
provider = "managed:kimi-code"
model = "kimi-for-coding"
max_context_size = 262144
capabilities = ["thinking", "image_in", "video_in"]
display_name = "Kimi-k2.6"

[providers."managed:kimi-code"]
type = "kimi"
base_url = "https://api.kimi.com/coding/v1"
api_key = ""

[providers."managed:kimi-code".oauth]
storage = "file"
key = "oauth/kimi-code"

[loop_control]
max_steps_per_turn = 100
max_retries_per_step = 3
max_ralph_iterations = 0
reserved_context_size = 50000
compaction_trigger_ratio = 0.85

[background]
max_running_tasks = 4
read_max_bytes = 30000
notification_tail_lines = 20
notification_tail_chars = 3000
wait_poll_interval_ms = 500
worker_heartbeat_interval_ms = 5000
worker_stale_after_ms = 15000
kill_grace_period_ms = 2000
keep_alive_on_exit = false
agent_task_timeout_s = 900
print_wait_ceiling_s = 3600

[notifications]
claim_stale_after_ms = 15000

[services.moonshot_search]
base_url = "https://api.kimi.com/coding/v1/search"
api_key = ""

[services.moonshot_search.oauth]
storage = "file"
key = "oauth/kimi-code"

[services.moonshot_fetch]
base_url = "https://api.kimi.com/coding/v1/fetch"
api_key = ""

[services.moonshot_fetch.oauth]
storage = "file"
key = "oauth/kimi-code"

[mcp.client]
tool_call_timeout_ms = 60000
